function sum(arr,fn){return arr.reduce((s,x)=>s+(Number(fn(x))||0),0)}

function cashIncome(){return sum(data.cash||[],x=>x.income)}
function cashExpense(){return sum(data.cash||[],x=>x.expense)}
function arrearsFor(period){return (data.arrearsPayments||[]).filter(x=>period==='all'||(period.length===4?(x.date||'').startsWith(period):(x.date||'').startsWith(period)))}

function saldoAwalHTML(){return `<div class="notice warning">Sisa kas periode sebelumnya untuk periode 2026–2027 diambil dari nilai “Jumlah Kas tersisa” pada lembar Pengeluaran Excel periode 2025–2026 (Rp1.591.000). Tunggakan periode lama yang baru dibayar harus dicatat di menu Pelunasan Tunggakan, agar nama warga, periode asal, dan tanggal penerimaan tercatat dengan benar.</div><div class="panel"><h2>Pengaturan Sisa Kas Periode Sebelumnya</h2><form id="openingBalanceForm"><div class="form-grid"><div class="field"><label for="openingBalanceInput">Sisa kas periode sebelumnya (Rp)</label><input id="openingBalanceInput" type="number" min="0" step="1" required value="${Number(data.openingBalance||0)}"></div><div class="field"><label for="openingAdditionInput">Penyesuaian sisa kas sebelumnya (Rp)</label><input id="openingAdditionInput" type="number" min="0" step="1" required value="${Number(data.openingBalanceAddition||0)}"></div></div><p class="muted">Sumber sisa kas: Excel periode 2025–2026 · Sisa kas periode sebelumnya: ${fmt(data.openingBalance)} · Penyesuaian: ${fmt(data.openingBalanceAddition||0)}</p><div class="actions" style="margin-top:14px"><button type="submit">Simpan Perubahan</button><button type="button" class="secondary" id="cancelOpeningBalance">Batal</button></div></form><div class="footer-note">Jangan gunakan penyesuaian sisa kas untuk pembayaran tunggakan warga. Catat pelunasan tersebut melalui menu Pelunasan Tunggakan agar tidak tercampur dengan saldo awal dasar atau pemasukan rutin.</div></div><div class="panel"><h2>Ringkasan Sisa Kas</h2><div class="grid"><div><div class="metric-label">SISA KAS SEBELUMNYA DASAR</div><div class="metric">${fmt(data.openingBalance)}</div></div><div><div class="metric-label">PENAMBAHAN SISA KAS SEBELUMNYA</div><div class="metric">${fmt(data.openingBalanceAddition||0)}</div></div><div><div class="metric-label">TOTAL IURAN</div><div class="metric">${fmt(totalIncome())}</div></div><div><div class="metric-label">PEMASUKAN B ead><tr><th>Waktu</th><th>Nama</th><th>Akun</th><th>Peran</th><th>Aktivitas</th><th>Detail</th></tr></thead><tbody>${logs.filter(l=>!window.activitySearch||JSON.stringify(l).toLowerCase().includes(String(window.activitySearch ?? '').toLowerCase())).map(l=>`<tr><td>${esc(l.at?new Date(l.at).toLocaleString('id-ID'):'—')}</td><td>${esc(l.name)}</td><td>${esc(l.username)}</td><td>${esc(l.role)}</td><td>${esc(l.action)}</td><td>${esc(l.detail||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada aktivitas.</td></tr>'}</tbody></table></div></div>`}

function laporanHTML(){const years=monthYears();const selectedYear=window.reportYear&&years.includes(Number(window.reportYear))?Number(window.reportYear):(new Date().getFullYear());window.reportYear=selectedYear;const selectedMonth=window.reportMonth||'all';const period=selectedMonth==='all'?String(selectedYear):selectedMonth;const cash=cashRowsFor(period);const arrears=arrearsFor(period);const tunggakanMasuk=sum(arrears,x=>x.amount);const masuk=sum(cash,c=>c.income),keluar=sum(cash,c=>c.expense),iuran=paymentSumFor(period);const now=new Date(),thisMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),thisYear=String(now.getFullYear()),currentMonthCash=cashRowsFor(thisMonth),currentYearCash=cashRowsFor(thisYear);const periodLabel=selectedMonth==='all'?'Tahun '+selectedYear:formatPeriodMonth(MONTHS_ID[Number(selectedMonth.slice(5,7))-1]+'-'+selectedMonth.slice(2,4));const months=allMonths().filter(m=>{const d=parseMonthKey(m);return d&&d.year===selectedYear});return `<div class="notice">Laporan dapat difilter per tahun atau per bulan. Pilih periode lalu tekan <b>Cetak / PDF</b> untuk menyimpan laporan periode tersebut. Data semua tahun tetap tersimpan dan dapat dibuka kembali.</div><div class="panel"><h2>Pemantauan berjalan</h2><div class="grid"><div class="card"><div class="metric-label">PEMASUKAN BULAN INI</div><div class="metric">${fmt(sum(currentMonthCash,c=>c.income)+paymentSumFor(thisMonth)+sum(arrearsFor(thisMonth),x=>x.amount))}</div></div><div class="card"><div class="metric-label">PENGELUARAN BULAN INI</div><div class="metric">${fmt(sum(currentMonthCash,c=>c.expense))}</div></div><div class="card"><div class="metric-label">PEMASUKAN TAHUN INI</div><div class="metric">${fmt(sum(currentYearCash,c=>c.income)+paymentSumFor(thisYear)+sum(arrearsFor(thisYear),x=>x.amount))}</div></div><div class="card"><div class="metric-label">PENGELUARAN TAHUN INI</div><div class="metric">${fmt(sum(currentYearCash,c=>c.expense))}</div></div><div class="card"><div class="metric-label">SISA SALDO TERAKHIR</div><div class="metric">${fmt(cashBalance())}</div><div class="metric-note">Sisa kas sebelumnya + penyesuaian + iuran + pemasukan lain − pengeluaran</div></div></div><div class="footer-note">Angka pemasukan mencakup iuran warga dan pemasukan lain yang dicatat di Buku Kas. Pengeluaran berasal dari transaksi kas bertanggal.</div></div><div class="panel no-print"><h2>Filter periode laporan</h2><div class="report-filters"><div class="field"><label>Tahun</label><select id="reportYear">${[...new Set([...years, new Date().getFullYear()])].sort((a,b)=>a-b).map(y=>`<option value="${y}" ${y===selectedYear?'selected':''}>${y}</option>`).join('')}</select></div><div class="field"><label>Bulan</label><select id="reportMonth"><option value="all" ${selectedMonth==='all'?'selected':''}>Semua bulan dalam tahun</option>${Array.from({length:12},(_,i)=>{const v=selectedYear+'-'+String(i+1).padStart(2,'0');return `<option value="${v}" ${selectedMonth===v?'selected':''}>${MONTHS_ID[i]} ${selectedYear}</option>`}).join('')}</select></div><div class="field"><label>Jenis laporan</label><div class="muted" style="padding:10px 0">Ringkasan, pemasukan, pengeluaran, iuran warga</div></div></div></div><div class="panel"><h2>Ringkasan keuangan — ${esc(periodLabel)}</h2><div class="grid"><div class="card"><div class="metric-label">IURAN MASUK</div><div class="metric">${fmt(iuran)}</div></div><div class="card"><div class="metric-label">PEMASUKAN LAIN</div><div class="metric">${fmt(masuk)}</div><div class="metric-note">Pelunasan tunggakan: ${fmt(tunggakanMasuk)}</div></div><div class="card"><div class="metric-label">TOTAL PENGELUARAN</div><div class="metric">${fmt(keluar)}</div></div><div class="card"><div class="metric-label">SISA SALDO TERAKHIR</div><div class="metric">${fmt(cashBalance())}</div></div></div><p class="muted">Sisa kas saat ini dihitung dari sisa kas periode sebelumnya, penyesuaian, iuran warga, pemasukan lain, dan dikurangi seluruh pengeluaran yang tercatat. Angka ini mencakup seluruh riwayat, bukan hanya periode yang sedang dipilih.</p></div><div class="panel"><h2>Laporan iuran per warga — ${selectedYear}</h2><div class="table-wrap"><table><thead><tr><th>No</th><th>Nama</th><th>Iuran/bln</th>${months.map(m=>`<th>${formatPeriodMonth(m)}</th>`).join('')}<th>Total tahun</th></tr></thead><tbody>${data.residents.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${fmt(r.fee)}</td>${months.map(m=>`<td>${data.payments?.[r.name]?.[m]?fmt(data.payments[r.name][m]):'—'}</td>`).join('')}<td><strong>${fmt(sum(months,m=>data.payments?.[r.name]?.[m]))}</strong></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Rincian pemasukan dan pengeluaran — ${esc(periodLabel)}</h2><div class="table-wrap"><table class="summary-table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Pemasukan</th><th>Pengeluaran</th></tr></thead><tbody>${cash.map(c=>`<tr><td>${esc(c.date||'—')}</td><td>${esc(c.description)}</td><td>${esc(c.category)}</td><td>${c.income?fmt(c.income):'—'}</td><td>${c.expense?fmt(c.expense):'—'}</td></tr>`).join('')}${arrears.map(a=>`<tr><td>${esc(a.date||'—')}</td><td>Pelunasan tunggakan ${esc(a.resident)} (${esc(a.period)})</td><td>Pelunasan tunggakan periode sebelumnya</td><td>${fmt(a.amount)}</td><td>—</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada transaksi kas pada periode ini.</td></tr>'}</tbody><tfoot><tr><th colspan="3">TOTAL PERIODE</th><th>${fmt(masuk+tunggakanMasuk)}</th><th>${fmt(keluar)}</th></tr></tfoot></table></div></div><div class="panel"><h2>Ringkasan keuangan semua tahun</h2><p class="muted">Kolom selisih menunjukkan pemasukan dikurangi pengeluaran pada masing-masing tahun. Ini bukan sisa kas keseluruhan.</p><div class="table-wrap"><table><thead><tr><th>Tahun</th><th>Iuran masuk</th><th>Pemasukan lain</th><th>Pelunasan tunggakan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead><tbody>${[...new Set([...years,...(data.cash||[]     if(!savedCash.some(c=>c&&c.id===transaction.id))throw new Error('Firebase merespons, tetapi transaksi Buku Kas belum ditemukan dalam data yang tersimpan.');

 let connect=document.getElementById('connectFirebase');if(connect)connect.onclick=async()=>{if(!requireRole(['admin']))return;const c={apiKey:document.getElementById('fbApiKey').value.trim(),authDomain:document.getElementById('fbAuthDomain').value.trim(),projectId:document.getElementById('fbProjectId').value.trim(),appId:document.getElementById('fbAppId').value.trim(),storageBucket:document.getElementById('fbBucket').value.trim(),messagingSenderId:document.getElementById('fbSenderId').value.trim()};if(!c.apiKey||!c.projectId||!c.appId){alert('Isi API Key, Project ID, dan App ID.');return}localStorage.setItem(CONFIG_KEY,JSON.stringify(c));await connectCloud(c)};
 let syncAll=document.getElementById('syncAllNow');if(syncAll)syncAll.onclick=async()=>{if(!requireRole(['admin']))return;syncAll.disabled=true;const msg=document.getElementById('syncMessage');if(msg)msg.textContent='Sedang menyinkronkan semua data dengan Firebase…';try{await syncAllFirebaseData();if(msg)msg.textContent='Sinkronisasi berhasil. Data aplikasi dan daftar akun telah diperbarui dari Firebase.';toast('Sinkronisasi berhasil.');}catch(err){if(msg)msg.textContent='Sinkronisasi gagal: '+(err.message||'Periksa koneksi dan aturan Firebase.');alert('Sinkronisasi gagal: '+(err.message||err));}finally{syncAll.disabled=false}};
 let syncAct=document.getElementById('syncActivityNow');if(syncAct)syncAct.onclick=async()=>{if(!requireRole(['admin']))return;syncAct.disabled=true;const msg=document.getElementById('activitySyncMessage');if(msg)msg.textContent='Sedang mengambil status akun dari Firebase…';try{await refreshCloudUsers();if(msg)msg.textContent='Sinkronisasi berhasil. Daftar akun aktif dan pendaftaran terbaru sudah diperbarui.';render();}catch(err){if(msg)msg.textContent='Sinkronisasi gagal: '+(err.message||'Periksa koneksi dan aturan Firebase.');syncAct.disabled=false}};
 let disc=document.getElementById('disconnectFirebase');if(disc)disc.onclick=()=>{if(!requireRole(['admin']))return;if(unsub){unsub();unsub=null}db=null;auth=null;firebaseApp=null;updateSyncLabel('● Mode lokal<br>Data tersimpan di perangkat ini.');render();toast('Koneksi sinkronisasi diputuskan.')};
 let back2=document.getElementById('backupBtn2');if(back2)back2.onclick=()=>{if(requireRole(['admin']))backup()};
 let restore=document.getElementById('restoreFile');if(restore)restore.onchange=async e=>{if(!requireRole(['admin'])){e.target.value='';return}let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d.residents||!d.payments||!d.cash)throw Error('Format tidak sesuai');if(confirm('Ganti data aplikasi dengan data cadangan ini?')){data=d;persist('Cadangan berhasil dipulihkan.')}}catch(err){alert('File cadangan tidak valid: '+err.message)}};
}
function backup(){const blob=new Blob([JSON.stringify({...data,_exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadangan-iuran-rt01-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('backupBtn').onclick=backup;document.getElementById('pdfBtn').onclick=()=>window.print();
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
/* Firebase modular SDK loaded only when the user chooses to connect. */
async function refreshCloudUsers(){if(!currentUser||currentUser.role!=='admin')throw new Error('Hanya Admin yang dapat menyinkronkan daftar akun.');await ensureFirebase();const snap=await window._firebaseFns.getDocs(window._firebaseFns.collection(db,'userRoles'));cloudUsersCache=snap.docs.map(d=>({uid:d.id,...d.data()}));return cloudUsersCache;}
async function syncAllFirebaseData(){if(!currentUser||currentUser.role!=='admin')throw new Error('Hanya Admin yang dapat menyinkronkan semua data.');await ensureFirebase();const fs=window._firebaseFns;const ref=fs.doc(db,'iuranRT','dataBersama');const snap=await fs.getDoc(ref);if(snap.exists()){const cloud=snap.data();if(cloud.payload){data=cloud.payload;lastCloudUpdate=cloud.updatedAt||Date.now();saveLocal();}}else{await fs.setDoc(ref,{payload:data,updatedAt:Date.now(),updatedBy:currentUser.uid},{merge:true});lastCloudUpdate=Date.now();}await refreshCloudUsers();if(page==='aktivitas'||page==='sinkronisasi')render();return true;}
async function connectCloud(c){const msg=document.getElementById('syncMessage');if(msg)msg.textContent='Menghubungkan sinkronisasi Firebase…';try{await ensureFirebase();const ref=window._firebaseFns.doc(db,'iuranRT','dataBersama');if(unsub){unsub();unsub=null}unsub=window._firebaseFns.onSnapshot(ref,snap=>{if(snap.exists()){const cloud=snap.data();if(cloud.payload&&cloud.updatedAt>lastCloudUpdate){lastCloudUpdate=cloud.updatedAt;data=cloud.payload;saveLocal();render();}}else if(currentUser?.role==='admin'){syncToCloud(true)}});if(currentUser?.role==='admin'){const q=window._firebaseFns.query(window._firebaseFns.collection(db,'userRoles'));window._firebaseFns.onSnapshot(q,ss=>{cloudUsersCache=ss.docs.map(d=>({uid:d.id,...d.data()}));if(page==='aktivitas')render()})}window._firebaseFns.ref=ref;updateSyncLabel('☁ Firebase tersambung<br>Sinkronisasi aktif');if(msg)msg.textContent='Terhubung. Akses data mengikuti peran akun.'; }catch(e){db=null;updateSyncLabel('⚠ Sinkronisasi gagal<br>Periksa konfigurasi Firebase');if(msg)msg.textContent='Gagal terhubung: '+e.message;console.error('Firebase:',e)}}
let pushTimer=null;
async function syncToCloud(force=false){if(!db||!window._firebaseFns||!currentUser||!['admin','bendahara'].includes(currentUser.role))return;clearTimeout(pushTimer);pushTimer=setTimeout(async()=>{if(syncBusy)return;syncBusy=true;try{const {setDoc,serverTimestamp}=window._firebaseFns;await setDoc(window._firebaseFns.ref,{payload:data,updatedAt:Date.now(),updatedBy:auth?.currentUser?.uid||'anonymous'},{merge:true});lastCloudUpdate=Date.now()}catch(e){console.error(e);toast('Gagal menyinkronkan: '+e.message)}finally{syncBusy=false}},force?0:500)}
