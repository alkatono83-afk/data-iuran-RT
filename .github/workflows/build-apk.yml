
name: Build APK Iuran RT 01

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java untuk Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Terapkan ikon aplikasi
        run: npx capacitor-assets generate --android

      - name: Sinkronkan aplikasi HTML
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan file APK
        uses: actions/upload-artifact@v4
        with:
          name: Iuran-RT-01-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
